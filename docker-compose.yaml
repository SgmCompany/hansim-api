services:
  db:
    image: mysql:8.0
    container_name: hansim-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    ports:
      - '${DB_PORT:-3306}:3306'
    command:
      - '--default-authentication-plugin=mysql_native_password'
      - '--default-time-zone=+00:00'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - hansim-network

  redis:
    image: redis:7-alpine
    container_name: hansim-redis
    ports:
      - '6379:6379'
    networks:
      - hansim-network

volumes:
  db_data:

networks:
  hansim-network:
    driver: bridge